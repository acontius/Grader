name: CI – Task 1 Grader Agent

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run unit & integration tests
        run: |
          pytest tests/ -v --cov=grader --cov-report=term-missing --cov-report=xml

      - name: Grade sample submission (smoke test)
        run: |
          python grader.py --submission sample_submission --output sample_report.json
          python -c "
          import json, sys
          r = json.load(open('sample_report.json'))
          print('Sample score:', r['total_score'])
          assert r['total_score'] >= 95, 'Sample submission should score near 100'
          print('Smoke test passed.')
          "

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
